name: Datenpipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('pipeline/config.json') }}
          restore-keys: raw-
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/run.py
      - name: Zusammenfassung
        run: |
          du -sh public/data public/data/*
          python -c "import json;m=json.load(open('public/data/manifest.json'));print(json.dumps({k:v for k,v in m.items() if k!='tiles'},indent=1));print(len(m['tiles']),'Kacheln')"
      - uses: actions/upload-artifact@v4
        with:
          name: uzwil3d-data
          path: public/data
          retention-days: 30
